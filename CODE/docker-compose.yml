version: "2.2"

services:
  material-transfer-robot:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        USERNAME: myrobo
        UID: 1000
        GID: 1000
    image: material-transfer-robot
    container_name: material-transfer-robot-container
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - DISPLAY=${DISPLAY:-0}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_GRAPHICSSYSTEM=native
      - LIBGL_ALWAYS_INDIRECT=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_${ROS_MODE:-local}.xml
      - CYCLONE_INTERFACE_IP
    volumes:
      - /dev:/dev
      - .:/workspace
      - ./cyclonedds_local.xml:/workspace/cyclonedds_local.xml:ro
      - ./cyclonedds_network.xml:/workspace/cyclonedds_network.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.docker.xauth:rw
      - zed_settings:/usr/local/zed/settings
      - zed_resources:/usr/local/zed/resources
    network_mode: host
    privileged: true
    pid: host
    ipc: host
    stdin_open: true
    tty: true
    command: bash

volumes:
  zed_settings:
  zed_resources:
  area_memory:
