version: "2.2"

services:
  viz-bridge:
    image: material-transfer-robot
    container_name: viz-bridge-container
    depends_on:
      - material-transfer-robot
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_local.xml
      - CYCLONE_INTERFACE_IP
    volumes:
      - .:/workspace
      - ./cyclonedds_local.xml:/workspace/cyclonedds_local.xml:ro
      - ./cyclonedds_viz_bridge.xml:/workspace/cyclonedds_viz_bridge.xml:ro
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    command: bash -c "source /opt/ros/humble/setup.bash && source /workspace/ros_ws/install/setup.bash 2>/dev/null && python3 /workspace/viz_bridge.py"

  viz-laptop:
    image: material-transfer-robot
    container_name: viz-laptop-container
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - DISPLAY
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_GRAPHICSSYSTEM=native
      - LIBGL_ALWAYS_INDIRECT=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=43
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_network.xml
      - CYCLONE_INTERFACE_IP
      - RVIZ_CONFIG
    volumes:
      - .:/workspace
      - ./cyclonedds_network.xml:/workspace/cyclonedds_network.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.docker.xauth:rw
    network_mode: host
    command: bash -c "source /opt/ros/humble/setup.bash && source /workspace/ros_ws/install/setup.bash 2>/dev/null && rviz2 -d $${RVIZ_CONFIG:-/workspace/rviz/viz.rviz}"
