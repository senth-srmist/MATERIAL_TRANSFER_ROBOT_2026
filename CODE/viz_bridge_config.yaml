# ============================================================================
# Visualization Bridge Configuration
#
# Topics to forward from robot (domain 42, local) to laptop (domain 43, network).
# Only topics listed here will be sent over WiFi.
#
# Format:
#   - topic: /source_topic_name
#     type: package.msg.MessageType
#     rate: target_hz (0 = relay without throttle, e.g. for transient local)
#
# To add a topic: just add an entry here and restart the bridge.
# To remove: delete or comment out the entry.
# ============================================================================

# Network settings
bridge:
  robot_domain_id: 42
  viz_domain_id: 43
  cyclonedds_config: /workspace/cyclonedds_network.xml

topics:
  # --- TF (essential for rviz, but very high rate normally) ---
  - topic: /tf
    type: tf2_msgs.msg.TFMessage
    rate: 5.0

  - topic: /tf_static
    type: tf2_msgs.msg.TFMessage
    rate: 0       # Relay once (latched/transient local)

  # --- Odometry ---
  - topic: /odom/base_link
    type: nav_msgs.msg.Odometry
    rate: 2.0

  # --- Maps & costmaps ---
  - topic: /map
    type: nav_msgs.msg.OccupancyGrid
    rate: 0       # Relay on change only

  - topic: /global_costmap/costmap
    type: nav_msgs.msg.OccupancyGrid
    rate: 0.5

  - topic: /local_costmap/costmap
    type: nav_msgs.msg.OccupancyGrid
    rate: 1.0

  # --- Planning ---
  - topic: /plan
    type: nav_msgs.msg.Path
    rate: 1.0

  # --- Robot status ---
  - topic: /robot_health
    type: system_supervisor.msg.RobotHealth
    rate: 1.0

  # --- Uncomment to add more ---
  # - topic: /goal_pose
  #   type: geometry_msgs.msg.PoseStamped
  #   rate: 1.0
  #
  # - topic: /visualization_markers
  #   type: visualization_msgs.msg.MarkerArray
  #   rate: 1.0
  #
  # - topic: /active_tile
  #   type: std_msgs.msg.Int32
  #   rate: 0
