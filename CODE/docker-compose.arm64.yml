# ==============================================================================
# docker-compose_arm64.yml - Jetson ARM64 Overlay (Simplified)
# ==============================================================================
#
# Key changes from original:
# 1. REMOVED all CUDA mounts - CUDA is now IN the base image (dustynv)
# 2. REMOVED cuDNN/TensorRT mounts - included in dustynv image
# 3. KEPT Tegra EGL mounts - still needed for headless GPU access
# 4. KEPT GPIO/device access - needed for hardware control
#
# Usage:
#   # Local DDS mode (single robot, no network)
#   ROS_MODE=local docker-compose -f docker-compose.yml -f docker-compose_arm64.yml up
#
#   # Network DDS mode (for viz bridge to laptop)
#   CYCLONE_INTERFACE_IP=192.168.50.1 ROS_MODE=network docker-compose -f docker-compose.yml -f docker-compose_arm64.yml up
#
# ==============================================================================

version: "2.2"

services:
  material-transfer-robot:
    environment:
      # --- NVIDIA/Tegra runtime ---
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      
      # --- EGL for headless GPU (ZED uses EGL, not X11) ---
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_DIRS=/usr/lib/aarch64-linux-gnu/tegra-egl
      - EGL_PLATFORM=device
      - __EGL_DEVICE_INDEX=0
      
      # --- Unset DISPLAY for headless operation ---
      - DISPLAY=
      
      # --- CycloneDDS (inherits ROS_MODE from main compose) ---
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_${ROS_MODE:-local}.xml

    volumes:
      # --- Tegra EGL libraries (required for headless GPU) ---
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra-egl:ro
      - /usr/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d:ro
      
      # --- CUDA runtime libraries (from host JetPack installation) ---
      # Mount the entire CUDA lib directory to provide all .so files
      - /usr/local/cuda-10.2/targets/aarch64-linux/lib:/usr/local/cuda-10.2/targets/aarch64-linux/lib:ro
      
      # --- GPIO access ---
      - /sys/class/gpio:/sys/class/gpio

    devices:
      # --- GPU/CUDA devices ---
      - /dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu
      - /dev/nvhost-prof-gpu
      - /dev/nvmap
      - /dev/nvhost-gpu
      - /dev/nvhost-as-gpu
      - /dev/nvhost-ctxsw-gpu
      - /dev/nvhost-dbg-gpu
      - /dev/nvhost-sched-gpu
      - /dev/nvhost-tsg-gpu
      - /dev/dri
      # --- GPIO ---
      - /dev/gpiochip0

    group_add:
      - "104"  # input
      - "20"   # dialout (serial ports)
      - "999"  # gpio
