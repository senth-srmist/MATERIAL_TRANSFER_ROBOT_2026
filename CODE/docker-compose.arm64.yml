version: "2.2"

services:
  material-transfer-robot:
    environment:
      # CUDA environment variables for mounted host CUDA (ARM64 only)
      - CUDA_HOME=/usr/local/cuda-10.2
      - CUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-10.2
      - PATH=/usr/local/cuda-10.2/bin:${PATH}
      - CUDA_INCLUDE_DIRS=/usr/local/cuda-10.2/include
      - CUDA_CUDART_LIBRARY=/usr/local/cuda-10.2/lib64/libcudart.so
      # Library paths for CUDA, cuDNN, TensorRT, Tegra
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra:/usr/local/cuda-10.2/lib64:/usr/local/lib/cudnn:/usr/local/lib/tensorrt:${LD_LIBRARY_PATH}
      # EGL/Display variables for ARM64
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_DIRS=/usr/lib/aarch64-linux-gnu/tegra-egl
      # CRITICAL: Force device-based EGL (not X11)
      - EGL_PLATFORM=device
      - __EGL_DEVICE_INDEX=0
      # Unset DISPLAY to force headless/device EGL
      - DISPLAY=
      # CycloneDDS - inherits ROS_MODE from main compose
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_${ROS_MODE:-local}.xml
    volumes:
      # Mount host CUDA installation
      - /usr/local/cuda-10.2:/usr/local/cuda-10.2:ro
      # Mount Tegra libraries (separate directories, safe to mount)
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra-egl:ro
      # Mount cuDNN libraries to separate path (don't overwrite container libs)
      - /usr/lib/aarch64-linux-gnu/libcudnn.so.8:/usr/local/lib/cudnn/libcudnn.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn.so.8.2.1:/usr/local/lib/cudnn/libcudnn.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_ops_infer.so.8:/usr/local/lib/cudnn/libcudnn_ops_infer.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_ops_infer.so.8.2.1:/usr/local/lib/cudnn/libcudnn_ops_infer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_ops_train.so.8:/usr/local/lib/cudnn/libcudnn_ops_train.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_ops_train.so.8.2.1:/usr/local/lib/cudnn/libcudnn_ops_train.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_cnn_infer.so.8:/usr/local/lib/cudnn/libcudnn_cnn_infer.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_cnn_infer.so.8.2.1:/usr/local/lib/cudnn/libcudnn_cnn_infer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_cnn_train.so.8:/usr/local/lib/cudnn/libcudnn_cnn_train.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_cnn_train.so.8.2.1:/usr/local/lib/cudnn/libcudnn_cnn_train.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_adv_infer.so.8:/usr/local/lib/cudnn/libcudnn_adv_infer.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_adv_infer.so.8.2.1:/usr/local/lib/cudnn/libcudnn_adv_infer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_adv_train.so.8:/usr/local/lib/cudnn/libcudnn_adv_train.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_adv_train.so.8.2.1:/usr/local/lib/cudnn/libcudnn_adv_train.so.8.2.1:ro
      # Mount TensorRT libraries to separate path
      - /usr/lib/aarch64-linux-gnu/libnvinfer.so.8:/usr/local/lib/tensorrt/libnvinfer.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer.so.8.2.1:/usr/local/lib/tensorrt/libnvinfer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer_plugin.so.8:/usr/local/lib/tensorrt/libnvinfer_plugin.so.8:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer_plugin.so.8.2.1:/usr/local/lib/tensorrt/libnvinfer_plugin.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer_builder_resource.so.8.2.1:/usr/local/lib/tensorrt/libnvinfer_builder_resource.so.8.2.1:ro
      # Mount nvidia EGL vendor config
      - /usr/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d:ro
      - /sys/class/gpio
    devices:
      - /dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu
      - /dev/nvhost-prof-gpu
      - /dev/nvmap
      - /dev/nvhost-gpu
      - /dev/nvhost-as-gpu
      - /dev/nvhost-ctxsw-gpu
      - /dev/nvhost-dbg-gpu
      - /dev/nvhost-sched-gpu
      - /dev/nvhost-tsg-gpu
      - /dev/dri
      - /dev/gpiochip0
    group_add:
      - "104" #Input
      - "20" #Dialout
      - "999" #GPIO
