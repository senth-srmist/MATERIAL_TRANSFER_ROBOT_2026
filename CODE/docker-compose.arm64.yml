version: "2.2"

services:
  material-transfer-robot:
    environment:
      - CUDA_HOME=/usr/local/cuda
      - CUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda
      - PATH=/usr/local/cuda/bin:${PATH}
      - CUDA_INCLUDE_DIRS=/usr/local/cuda/include
      - CUDA_CUDART_LIBRARY=/usr/local/cuda/lib64/libcudart.so
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu-cudnn:/usr/local/zed/lib
      - __EGL_VENDOR_LIBRARY_DIRS=/usr/lib/aarch64-linux-gnu/tegra-egl
      - EGL_PLATFORM=device
      - DISPLAY=
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_${ROS_MODE:-local}.xml
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - /usr/local/cuda-10.2:/usr/local/cuda:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra-egl:ro
      - /usr/lib/aarch64-linux-gnu/dri:/usr/lib/aarch64-linux-gnu/dri:ro
      - /opt/jetson-cudnn-only:/usr/lib/aarch64-linux-gnu-cudnn:ro
      - /usr/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d:ro
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /sys/class/gpio
      - /run/user/1000/pulse:/run/user/1000/pulse:rw
      - ${HOME}/.config/pulse/cookie:/home/myrobo/.config/pulse/cookie:ro
    devices:
      - /dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu
      - /dev/nvhost-prof-gpu
      - /dev/nvhost-gpu
      - /dev/nvhost-as-gpu
      - /dev/nvhost-ctxsw-gpu
      - /dev/nvhost-dbg-gpu
      - /dev/nvhost-sched-gpu
      - /dev/nvhost-tsg-gpu
      - /dev/nvmap
      - /dev/dri
      - /dev/nvhost-vic
      - /dev/nvhost-msenc
      - /dev/nvhost-nvdec
      - /dev/nvhost-nvjpg
      - /dev/nvhost-tsec
      - /dev/nvhost-tsecb
      - /dev/nvhost-isp
      - /dev/nvhost-isp.1
      - /dev/nvhost-ctrl-isp
      - /dev/nvhost-ctrl-isp.1
      - /dev/nvhost-ctrl-nvdec
      - /dev/nvhost-ctrl-vi
      - /dev/nvhost-vi
      - /dev/tegra_dc_0
      - /dev/tegra_dc_1
      - /dev/tegra_dc_ctrl
      - /dev/tegra-crypto
      - /dev/tegra_cec
      - /dev/tegra_mipi_cal
      - /dev/tegra_camera_ctrl
      - /dev/gpiochip0
    group_add:
      - "104" # Input
      - "20" # Dialout
      - "999" # GPIO
      - "29" # Audio
