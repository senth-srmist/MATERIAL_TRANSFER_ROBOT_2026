version: "2.2"

services:
  material-transfer-robot:
    environment:
      # CUDA environment variables (mapped to /usr/local/cuda alias)
      - CUDA_HOME=/usr/local/cuda
      - CUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda
      - PATH=/usr/local/cuda/bin:${PATH}
      - CUDA_INCLUDE_DIRS=/usr/local/cuda/include
      - CUDA_CUDART_LIBRARY=/usr/local/cuda/lib64/libcudart.so
      # Tegra EGL first, then CUDNN/TRT path
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu-cudnn:/usr/local/zed/lib:${LD_LIBRARY_PATH}
      # EGL headless/device mode for Jetson (no display server)
      - __EGL_VENDOR_LIBRARY_DIRS=/usr/lib/aarch64-linux-gnu/tegra-egl
      - EGL_PLATFORM=device
      - DISPLAY=
      - NVIDIA_DRIVER_CAPABILITIES=all
      # CycloneDDS
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///workspace/cyclonedds_${ROS_MODE:-local}.xml
    volumes:
      # CUDA as alias (matches working docker run)
      - /usr/local/cuda-10.2:/usr/local/cuda:ro
      # Tegra runtime libraries
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/tegra-egl:/usr/lib/aarch64-linux-gnu/tegra-egl:ro
      - /usr/lib/aarch64-linux-gnu/dri:/usr/lib/aarch64-linux-gnu/dri:ro
      # CUDNN + TRT isolated dir (cp'd from host, not symlinked)
      - /opt/jetson-cudnn-only:/usr/lib/aarch64-linux-gnu-cudnn:ro
      # EGL vendor config
      - /usr/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d:ro
      # Argus daemon socket (critical for Tegra EGL/ZED)
      - /tmp/argus_socket:/tmp/argus_socket
      # Tegra release info
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /sys/class/gpio
    devices:
      # GPU
      - /dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu
      - /dev/nvhost-prof-gpu
      - /dev/nvhost-gpu
      - /dev/nvhost-as-gpu
      - /dev/nvhost-ctxsw-gpu
      - /dev/nvhost-dbg-gpu
      - /dev/nvhost-sched-gpu
      - /dev/nvhost-tsg-gpu
      - /dev/nvmap
      - /dev/dri
      # Video/display engines (needed by TensorRT on Jetson)
      - /dev/nvhost-vic
      - /dev/nvhost-msenc
      - /dev/nvhost-nvdec
      - /dev/nvhost-nvjpg
      - /dev/nvhost-tsec
      - /dev/nvhost-tsecb
      # ISP / camera
      - /dev/nvhost-isp
      - /dev/nvhost-isp.1
      - /dev/nvhost-ctrl-isp
      - /dev/nvhost-ctrl-isp.1
      - /dev/nvhost-ctrl-nvdec
      - /dev/nvhost-ctrl-vi
      - /dev/nvhost-vi
      # Tegra display/misc
      - /dev/tegra_dc_0
      - /dev/tegra_dc_1
      - /dev/tegra_dc_ctrl
      - /dev/tegra-crypto
      - /dev/tegra_cec
      - /dev/tegra_mipi_cal
      - /dev/tegra_camera_ctrl
      # GPIO
      - /dev/gpiochip0
    group_add:
      - "104"  # Input
      - "20"   # Dialout
      - "999"  # GPIO
