# =============================================================================
# Level 2.5A: Stuck Recovery — Wall Approach
# =============================================================================
# Tests: progress_checker → BT recovery sequence
#
# This level validates that the Behavior Tree recovery chain works
# BEFORE relying on it in full missions (Level 3).
#
# Procedure:
#   1. Place robot facing a wall, ~0.3m away
#   2. Send goal THROUGH the wall (unreachable)
#   3. Robot should: attempt → get stuck → progress_checker fires →
#      recovery sequence: clear_costmap → spin → backup → wait → replan
#   4. Eventually should abort the goal (no valid path)
# =============================================================================

scenario:
  name: L2_5_stuck_recovery
  level: 2.5
  id: 7
  description: "Stuck near wall — tests progress_checker + recovery behaviors"

  # Set goal behind a wall — robot will get stuck
  goals:
    - x: -2.0
      y: 0.0
      yaw: 0.0

  record_topics:
    - /cmd_vel_nav2
    - /cmd_vel_pid
    - /odom/base_link
    - /plan
    - /local_costmap/costmap
    - /pid/debug
    - /metrics/velocity_tracking
    - /metrics/path_tracking
    - /metrics/test_status

  # What to look for:
  #   1. Time until progress_checker detects stuck:
  #      → Current: movement_time_allowance = 45s — WAY too long
  #      → Should detect within 15-20s
  #
  #   2. Recovery sequence on /rosout:
  #      → [bt_navigator]: Recovery: clear costmap
  #      → [bt_navigator]: Recovery: spin
  #      → [bt_navigator]: Recovery: backup
  #      → [bt_navigator]: Recovery: wait
  #
  #   3. Does the robot eventually give up gracefully?
  #      → Should abort goal, not loop forever
  #
  # Key parameters:
  #   - progress_checker.movement_time_allowance: 45.0 → try 15.0
  #   - progress_checker.required_movement_radius: 0.3 — OK
  #   - backup.speed_limit: 0.2 — matches min_linear_vel

  pass_criteria:
    stuck_detected_within_s: 20
    recovery_triggers: true
    does_not_loop_forever: true

---
# =============================================================================
# Level 2.5B: Path Blocked Mid-Navigation
# =============================================================================

scenario:
  name: L2_5_path_blocked
  level: 2.5
  id: 8
  description: "Path blocked during navigation — tests dynamic replanning"

  goals:
    - x: 5.0
      y: 0.0
      yaw: 0.0

  record_topics:
    - /cmd_vel_nav2
    - /cmd_vel_pid
    - /odom/base_link
    - /plan
    - /local_costmap/costmap
    - /metrics/velocity_tracking
    - /metrics/path_tracking

  # Procedure:
  #   1. Start navigation to a goal 5m away
  #   2. After robot starts moving, block the path completely with an object
  #   3. Robot should detect the obstacle, attempt replan
  #   4. If no alternate path, recovery should trigger
  #
  # This differs from L2_human because:
  #   - It uses obstacle_layer (not human_layer)
  #   - Robot should REPLAN, not just stop
  #   - Tests the planner's ability to find alternate routes

  pass_criteria:
    detects_obstacle: true
    attempts_replan: true
    recovery_if_no_path: true

---
# =============================================================================
# Level 2.5C: Trapped Robot
# =============================================================================

scenario:
  name: L2_5_trapped
  level: 2.5
  id: 9
  description: "Robot surrounded by obstacles — tests graceful abort"

  goals:
    - x: 5.0
      y: 0.0
      yaw: 0.0

  record_topics:
    - /cmd_vel_nav2
    - /cmd_vel_pid
    - /odom/base_link
    - /plan
    - /local_costmap/costmap
    - /metrics/velocity_tracking

  # Procedure:
  #   1. Surround the robot with obstacles on 3+ sides
  #   2. Send a goal it can't reach
  #   3. Robot should: try recovery → fail → abort (NOT spin forever)
  #
  # Watch for:
  #   - Spin behavior in tight space — may collide with obstacles
  #   - Backup behavior — may back into obstacle behind
  #   - Infinite recovery loops — BT should have max recovery attempts

  pass_criteria:
    aborts_within_s: 120
    no_collision: true
    no_infinite_loop: true
