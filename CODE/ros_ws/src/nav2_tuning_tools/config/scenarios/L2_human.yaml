# =============================================================================
# Level 2A: Human Detection Response
# =============================================================================
# Tests: human_layer costmap plugin, stop-and-alarm behavior
#
# Procedure:
#   1. Send robot to a goal 5m away
#   2. While robot is navigating, walk in front of it
#   3. Robot should STOP (not replan around the human)
#   4. Walk away — robot should resume after persistence_time expires
#
# This validates the human detection → costmap → Nav2 reaction chain.
# =============================================================================

scenario:
  name: L2_human
  level: 2
  id: 4
  description: "Human walks in path — tests stop-and-alarm behavior"

  goals:
    - x: 5.0
      y: 0.0
      yaw: 0.0

  record_topics:
    - /cmd_vel_nav2
    - /cmd_vel_pid
    - /odom/base_link
    - /zed/zed_node/obj_det/objects
    - /local_costmap/costmap
    - /plan
    - /pid/debug
    - /metrics/velocity_tracking
    - /metrics/path_tracking

  # What to look for:
  #   1. /cmd_vel_nav2 linear.x should drop to 0 when human is detected
  #   2. Local costmap should show LETHAL cost (254) at human position
  #   3. Robot should NOT attempt to plan around the human
  #   4. After human moves away, costmap should clear within persistence_time (1.0s)
  #   5. Robot should resume navigation automatically
  #
  # Key parameters:
  #   - human_layer.human_cost: 254 (LETHAL) — should not be reduced
  #   - human_layer.inflation_radius: 0.3m safety buffer around human
  #   - human_layer.persistence_time: 1.0s — how long human stays in costmap

  pass_criteria:
    robot_stops_within_m: 0.5  # must stop within 0.5m of human
    does_not_replan_around: true
    resumes_within_s: 5  # after human clears
