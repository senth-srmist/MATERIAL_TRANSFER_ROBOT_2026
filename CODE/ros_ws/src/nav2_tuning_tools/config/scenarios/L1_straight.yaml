# =============================================================================
# Level 1A: Straight Line — 3m forward
# =============================================================================
# Tests: linear velocity tracking, acceleration profile, goal approach
#
# UPDATE GOALS BELOW to match your map. The robot should have 3m+ of
# clear space directly ahead from its starting position.
#
# Override at runtime:
#   ros2 run nav2_tuning_tools test_runner -s L1_straight -g "3.0,0,0"
# =============================================================================

scenario:
  name: L1_straight
  level: 1
  id: 1
  description: "Straight line 3m forward — tests linear velocity tracking"

  # DEFAULT GOALS — update x,y,yaw to match your map
  # These assume the robot starts near origin facing +X
  goals:
    - x: 3.0
      y: 0.0
      yaw: 0.0

  record_topics:
    - /cmd_vel_nav2
    - /cmd_vel_pid
    - /encoder/velocity
    - /odom/base_link
    - /plan
    - /local_plan
    - /pid/debug
    - /metrics/velocity_tracking
    - /metrics/path_tracking

  # What to look for in the graphs:
  # PlotJuggler panels:
  #   1. /pid/debug[1] vs /pid/debug[3] vs /pid/debug[21] vs /metrics/velocity_tracking[4]
  #      (nav2_raw_v vs rate_limited_v vs pid_output_v vs odom_actual_v)
  #      → All four should converge. Gap between them shows where the chain breaks.
  #
  #   2. /pid/debug[9] (left_error) and /pid/debug[15] (right_error)
  #      → Should converge to ~0. Persistent error = increase Ki
  #      → Oscillation = decrease Kp or increase Kd
  #
  #   3. /pid/debug[10,11,12] (left P,I,D terms)
  #      → I term should slowly grow to compensate steady-state error
  #      → D term should be small and smooth (not spiky)
  #
  #   4. /metrics/path_tracking[0] (lateral_deviation)
  #      → Should stay < 0.05m for a straight line

  pass_criteria:
    max_lateral_deviation_m: 0.05
    max_goal_xy_error_m: 0.5
    max_goal_yaw_error_rad: 0.2
    max_time_s: 30
