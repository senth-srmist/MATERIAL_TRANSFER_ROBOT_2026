  region_of_interest:
    automatic_roi: false
    manual_polygon: "[]"
  sensors:
    publish_imu_tf: false
    sensors_image_sync: false
    sensors_pub_rate: 1.0
  simulation:
    sim_enabled: false
  stream:
    stream_address: ""
  stream_server:
    adaptative_bitrate: false
    bitrate: 12500
    chunk_size: 16084
    codec: H264
    gop_size: -1
    port: 30000
    stream_enabled: false
    target_framerate: 0
  svo:
    svo_path: live
  use_sim_time: false
  video:
    auto_exposure_gain: true
    auto_whitebalance: true
    brightness: 4
    contrast: 4
    exposure: 80
    gain: 80
    gamma: 8
    hue: 0
    saturation: 4
    sharpness: 4
    whitebalance_temperature: 42
  zed_node:
    depth:
      depth_registered:
        enable_pub_plugins:
          - image_transport/compressed
          - image_transport/raw
        ffmpeg:
          bit_rate: -1
          encoder: libx264
          encoder_av_options: ""
          encoder_measure_performance: false
          gop_size: -1
          max_b_frames: 0
          pixel_format: ""
          qmax: -1
    point_cloud:
      cloud_registered:
        enable_pub_plugins:
          - point_cloud_transport/draco
          - point_cloud_transport/raw
    rgb:
      image_rect_color:
        enable_pub_plugins:
          - image_transport/raw
          - image_transport/compressed
        compressed:
          format: jpeg
          jpeg_quality: 70
