# config/zedm.yaml
# Optimized for indoor navigation robot
# Robot specs: 0.6 m/s cruise, 0.8 m/s max, ~2 rad/s angular
#
# Changes from default:
#   - HD720 (was HD1080): Saves ~35% CPU, ArUco range ~3-4m still good for indoor
#   - 15 fps (was 30): Fine for 0.6 m/s cruise speed, saves ~30% CPU
#   - ULTRA depth (was NEURAL_LIGHT): Detects walls, furniture, people; saves ~40% GPU
#   - Point cloud disabled: Not used for 2D navigation
#   - 10 Hz publish rate: Sufficient for Nav2 costmap updates
---
/**:
  ros__parameters:
    general:
      camera_model: "zedm"
      camera_name: "zed"
      grab_resolution: "HD720" # Was HD1080 - saves CPU, 3-4m ArUco range
      grab_frame_rate: 15 # Was 30 - sufficient for 0.6 m/s cruise
      pub_frame_rate: 10.0 # Was 15 - enough for Nav2 costmap

    video:
      brightness: 4
      contrast: 4
      hue: 0

    depth:
      depth_mode: "ULTRA" # Was NEURAL_LIGHT - good obstacle detection, less GPU
      min_depth: 0.2 # Was 0.01 - ignore objects too close
      max_depth: 8.0 # Was 10.0 - indoor doesn't need 10m range

    publishing:
      pub_point_cloud: false # Disabled - not needed for 2D navigation

    pos_tracking:
      publish_tf: true
      publish_map_tf: true
      pos_tracking_mode: "GEN_2" # Standard tracking mode
