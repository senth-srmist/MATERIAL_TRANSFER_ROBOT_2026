/zed/zed_node:
  ros__parameters:
    advanced:
      thread_sched_policy: SCHED_BATCH
    body_tracking:
      allow_reduced_precision_inference: false
      body_format: BODY_38
      body_kp_selection: FULL
      bt_enabled: false
      confidence_threshold: 50.0
      enable_body_fitting: false
      enable_tracking: true
      max_range: 20.0
      minimum_keypoints_threshold: 5
      model: HUMAN_BODY_MEDIUM
      prediction_timeout_s: 0.5
      qos_depth: 1
      qos_durability: 2
      qos_history: 1
      qos_reliability: 1
    debug:
      debug_advanced: false
      debug_body_tracking: false
      debug_camera_controls: false
      debug_common: false
      debug_gnss: false
      debug_mapping: false
      debug_object_detection: false
      debug_point_cloud: false
      debug_positional_tracking: false
      debug_sensors: false
      debug_sim: false
      debug_video_depth: false
      sdk_verbose: 0
    depth:
      depth_confidence: 80
      depth_mode: QUALITY
      depth_stabilization: 30
      depth_texture_conf: 80
      max_depth: 5.0
      min_depth: 0.4
      openni_depth_mode: false
      point_cloud_freq: 5.0
      qos_depth: 1
      qos_durability: 2
      qos_history: 1
      qos_reliability: 0
      remove_saturated_areas: true
    diagnostic_updater:
      period: 1.0
      use_fqn: false
    general:
      camera_flip: false
      camera_max_reconnect: 5
      camera_model: zedm
      camera_name: zed
      camera_timeout_sec: 45
      gpu_id: 0
      grab_frame_rate: 30
      grab_resolution: HD720
      optional_opencv_calibration_file: ""
      pub_downscale_factor: 2.0
      pub_frame_rate: 15.0
      pub_resolution: CUSTOM
      region_of_interest: "[]"
      self_calib: true
      serial_number: 0
      svo_file: live
    gnss_fusion:
      gnss_fusion_enabled: false
    mapping:
      clicked_point_topic: /clicked_point
      fused_pointcloud_freq: 1.0
      mapping_enabled: false
      max_mapping_range: 5.0
      pd_max_distance_threshold: 0.15
      pd_normal_similarity_threshold: 15.0
      qos_depth: 1
      qos_durability: 2
      qos_history: 1
      qos_reliability: 1
      resolution: 0.05
    object_detection:
      allow_reduced_precision_inference: true
      confidence_threshold: 50.0
      filtering_mode: "NMS3D_PER_CLASS"
      max_range: 5.0
      mc_animal: true
      mc_bag: true
      mc_electronics: true
      mc_fruit_vegetable: true
      mc_people: true
      mc_sport: true
      mc_vehicle: true
      detection_model: "CUSTOM_YOLOLIKE_BOX_OBJECTS"
      model: "CUSTOM_YOLOLIKE_BOX_OBJECTS"
      object_tracking_enabled: true
      od_enabled: true
      prediction_timeout: 1.0
      qos_depth: 5
      qos_durability: 2
      qos_history: 1
      qos_reliability: 1
    pos_tracking:
      area_memory: true
      area_memory_db_path: /usr/local/zed/area_memory/area_memory.area
      depth_min_range: 0.0
      floor_alignment: false
      imu_fusion: true
      init_odom_with_first_valid_pose: true
      initial_base_pose:
        - 0.174
        - 0.0
        - 0.746
        - 0.0
        - 0.523
        - 0.0
      map_frame: map
      odometry_frame: odom
      path_max_count: 100
      path_pub_rate: 1.0
      pos_tracking_enabled: true
      pos_tracking_mode: GEN_2
      publish_tf: false
      qos_depth: 1
      qos_durability: 1
      qos_history: 1
      qos_reliability: 0
      set_as_static: false
      set_gravity_as_origin: false
      transform_time_offset: 0.0
      two_d_mode: false
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 10
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 10
          durability: volatile
          history: keep_last
          reliability: reliable
    sensors:
      publish_imu_tf: false
      qos_depth: 1
      qos_durability: 2
      qos_history: 1
      qos_reliability: 0
      sensors_image_sync: false
      sensors_pub_rate: 1.0
    simulation:
      sim_enabled: false
    use_sim_time: false
    video:
      auto_exposure_gain: true
      auto_whitebalance: true
      brightness: 4
      contrast: 4
      exposure: 80
      gain: 80
      gamma: 8
      hue: 0
      qos_depth: 1
      qos_durability: 2
      qos_history: 1
      qos_reliability: 0
      saturation: 4
      sharpness: 4
      whitebalance_temperature: 42
    zed_node:
      rgb:
        image_rect_color:
          enable_pub_plugins:
            - image_transport/raw
