# ============================================================================
# Sabertooth Diff Drive Controller Configuration
# ============================================================================
# CHANGELOG v3 (motor-verified):
#   Motor: (J)JL-37C3540-72.8-12150, DC 12V
#   No-load output shaft: 150 rpm = 15.7 rad/s
#   Load output shaft:    137.5 rpm = 14.4 rad/s
#   Robot mass: 10 kg, wheel radius: 0.05 m
#
#   max_wheel_rad_s: 6.0 → 10.0
#     0.5 m/s (linear cap) ÷ 0.05 m = 10.0 rad/s
#     Motor physically supports 14.4 rad/s at load — 10.0 is safe & conservative.
#
#   max_wheel_accel: 4.0 → 3.0 rad/s²
#     Linear: 2τ/(m·r) = 2×0.038/(10×0.05) = 0.152 m/s²
#     In wheel rad/s²: 0.152/0.05 = 3.04 → 3.0 (conservative)
#     Previous value of 4.0 (= 0.2 m/s²) was higher than motor can sustain
#     under load, causing slipping/lag that the software didn't account for.
#     NOTE: If the Sabertooth DIP ramp switches are enabled, the effective
#     hardware accel may be even lower — disable ramp DIP switches for
#     software-controlled ramping to take full effect.
# ============================================================================

motor_driver:
  ros__parameters:
    # ---- Serial / Hardware ----
    serial_port: "/dev/ttyUSB0"
    serial_baud: 9600
    serial_reconnect_interval: 2.0 # seconds between reconnect attempts
    serial_write_timeout: 0.1 # seconds

    # ---- Physical Dimensions ----
    wheel_radius: 0.05 # meters

    # ---- Wheel Speed Limits ----
    max_wheel_rad_s:
      10.0 # rad/s — 0.5 m/s ÷ 0.05 m
      # Motor supports 14.4 rad/s at load; 10.0 is safe cap

    max_wheel_accel:
      3.0 # rad/s² — motor verified: 0.152 m/s² ÷ 0.05 m = 3.04
      # MUST be consistent with:
      #   decel_lim_x in nav2_params  (×0.05 = 0.15 m/s²)
      #   max_linear_decel in pid_params (0.15 m/s²)

    # ---- Motor Tuning ----
    motor_dead_zone:
      0.005 # normalized [-1,1] — true Sabertooth mechanical dead zone is tiny.
      # Previous value of 0.02 was zeroing out the reverse wheel
      # during slow rotation (w=0.1 rad/s → normalized=0.04, barely above 0.02).

    min_command_magnitude:
      0.04 # normalized [-1,1] minimum non-zero command magnitude.
      # Any non-zero command below this is clamped UP to this value,
      # preserving sign. Ensures the reverse wheel during rotation
      # always gets enough command to overcome static friction.
      # At half_range=63: 0.04 * 63 ≈ 2.5 → command byte offset of ~3.
      # Tune upward if reverse wheel still stalls at low angular speeds.

    # ---- Control Loop ----
    control_dt: 0.1 # seconds (10 Hz)
    cmd_timeout: 0.5 # watchdog timeout, seconds
    watchdog_decel_rate: 1.5 # decel rate during watchdog ramp-down, rad/s²
