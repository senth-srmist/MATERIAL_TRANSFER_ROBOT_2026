twist_mux:
  ros__parameters:
    # Output topic (this is what your controller subscribes to)
    output_topic: /cmd_vel_out
    qos_overrides:
      /cmd_vel_out:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 1

    # Timeout after which a source is considered inactive (seconds)
    timeout: 0.5

    topics:
      estop:
        topic: /cmd_vel_estop
        timeout: 0.5
        priority: 30

      joystick:
        topic: /cmd_vel_joy
        timeout: 0.5
        priority: 20

      nav2:
        topic: /cmd_vel_nav2
        timeout: 0.5
        priority: 10

      relocalize:
        topic: cmd_vel_relocalize
        timeout: 0.5
        priority: 5
