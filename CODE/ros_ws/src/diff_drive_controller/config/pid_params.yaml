# ============================================================================
# Wheel Speed Controller Configuration (v5 - Feedforward Only)
#
# PID removed. Pure feedforward control.
#
# Angular symmetry fix:
#   When |linear_vel| < rotation_threshold, both wheels use feedforward_gain_rotation
#   (a single symmetric gain) so |omega_left| == |omega_right| by construction.
#   For mixed/linear motion, per-wheel gains compensate the wiring asymmetry.
#
# CRITICAL RULE: Every velocity/accel limit here must mirror nav2_params.yaml.
# ============================================================================

pid_controller:
  ros__parameters:
    # ---- Physical (must match drive_params.yaml) ----
    wheel_radius: 0.05
    base_length: 0.4

    # ---- Control Loop ----
    control_rate: 10.0 # Hz

    # ---- Velocity Limits (must mirror DWB limits in nav2_params.yaml) ----
    min_linear_vel: -0.5 # m/s
    max_linear_vel: 0.5 # m/s
    min_angular_vel: -0.6 # rad/s
    max_angular_vel: 0.6 # rad/s

    # ---- Rate Limiter (must match acc/decel limits in nav2_params DWB config) ----
    max_linear_accel: 0.15 # m/s²
    max_linear_decel: 0.15 # m/s²
    max_angular_accel: 1.2 # rad/s²
    max_angular_decel: 1.2 # rad/s²

    # ---- Feedforward Gains ----
    #
    # feedforward_gain_left / feedforward_gain_right:
    #   Used during linear or mixed (v + w) motion.
    #   Left port drives physical right wheel (slower) → higher gain.
    #   Right port drives physical left wheel (faster) → lower gain.
    #   Tune by driving straight and adjusting until drift is zero.
    feedforward_gain_left: 1.17
    feedforward_gain_right: 1.15

    # feedforward_gain_rotation:
    #   Used for PURE rotation only (|linear_vel| < rotation_threshold).
    #   Both wheels use this SAME gain so speeds are equal and opposite.
    #   Start at the average of left/right gains and tune until the robot
    #   pivots at the commanded angular rate without drifting linearly.
    feedforward_gain_rotation: 1.16

    # rotation_threshold:
    #   |linear_vel| below this value → pure-rotation gain mode.
    #   Keep small (1-3 cm/s). If set too large, curved paths will use
    #   the symmetric gain and lose the asymmetry compensation.
    rotation_threshold: 0.02 # m/s

    # ---- Timeout ----
    cmd_timeout: 0.5 # seconds
