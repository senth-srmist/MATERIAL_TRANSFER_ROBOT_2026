# ============================================================================
# Wheel Speed Controller Configuration
#
# Sits after twist_mux. Subscribes to /cmd_vel_out (body Twist from any source),
# uses encoder feedback to close per-wheel velocity loops, publishes
# corrected wheel speeds on /wheel_speeds (Float32MultiArray [omega_l, omega_r]).
# ============================================================================

pid_controller:
  ros__parameters:
    # ---- Physical (must match controller_params.yaml) ----
    wheel_radius: 0.05
    base_length: 0.4

    # ---- Control Loop ----
    control_rate: 10.0                # Hz (match controller_node control_dt)

    # ---- Velocity Limits (clamp incoming body Twist before kinematics) ----
    min_linear_vel: -0.2   # m/s — max reverse speed
    max_linear_vel:  0.4   # m/s — max forward speed
    min_angular_vel: -0.4  # rad/s — max angular speed
    max_angular_vel:  0.4  # rad/s

    # ---- Rate Limiter ----
    max_linear_accel: 0.3
    max_linear_decel: 0.6
    max_angular_accel: 1.5
    max_angular_decel: 1.5

    # ---- PID Gains (per wheel, in rad/s) ----
    # Left motor runs ~5-8% faster than right (confirmed by encoder tick asymmetry).
    # Strategy: lower FF + higher Ki on left to compensate the naturally faster motor;
    #           higher FF + lower Ki on right to push the naturally slower motor harder.
    #
    # Tune by increasing kp until oscillation, then back off 30%, then add ki.
    kp_left:  0.1
    kp_right: 0.1
    ki_left:  0.12   # more aggressive integral on faster left — corrects overspeed faster
    ki_right: 0.08   # gentler integral on slower right — avoids integral windup fighting low torque
    kd_left:  0.01
    kd_right: 0.01

    # ---- Anti-Windup ----
    max_integral: 2.0                 # Clamp integral term (rad/s), shared

    # ---- Feedforward (per wheel) ----
    # Left motor is faster → lower FF so it doesn't overshoot on open-loop.
    # Right motor is slower → higher FF to push it closer to target before PID kicks in.
    feedforward_gain_left:  0.65
    feedforward_gain_right: 0.75

    # ---- Timeout ----
    cmd_timeout: 0.5                  # Nav2 command timeout (seconds)
