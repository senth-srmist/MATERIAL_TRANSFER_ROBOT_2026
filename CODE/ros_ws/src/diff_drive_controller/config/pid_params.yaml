# ============================================================================
# Wheel Speed Controller Configuration
#
# Sits after twist_mux. Subscribes to /cmd_vel_out (body Twist from any source),
# uses encoder feedback to close per-wheel velocity loops, publishes
# corrected wheel speeds on /wheel_speeds (Float32MultiArray [omega_l, omega_r]).
# ============================================================================
# CHANGELOG v3 (motor-verified):
#   Motor: (J)JL-37C3540-72.8-12150, DC 12V, load torque 0.038 N·m
#   Robot mass: 10 kg, wheel radius: 0.05 m, base_length: 0.4 m
#
#   max_linear_vel:   0.4  → 0.5   (facility cap, matches nav2)
#   min_linear_vel:  -0.2  → -0.1  (match min_vel_x in DWB)
#   max_angular_vel:  0.4  → 0.6   (match max_vel_theta in DWB)
#   min_angular_vel: -0.4  → -0.6
#   max_linear_accel: 0.3  → 0.15  (motor verified: 2τ/(m·r) = 0.152 m/s²)
#   max_linear_decel: 0.6  → 0.15  (must match decel_lim_x in nav2 — was root cause)
#   max_angular_accel:1.5  → 1.2   (motor verified: conservative of 1.52 rad/s²)
#   max_angular_decel:1.5  → 1.2   (match decel_lim_theta in nav2)
#
# CRITICAL RULE: Every limit here must have a matching limit in nav2_params.yaml.
# If DWB commands a velocity this layer silently clamps, DWB's trajectory
# simulation becomes wrong and overshoot is guaranteed.
# ============================================================================

pid_controller:
  ros__parameters:
    # ---- Physical (must match drive_params.yaml) ----
    wheel_radius: 0.05
    base_length: 0.4

    # ---- Control Loop ----
    control_rate: 10.0 # Hz

    # ---- Velocity Limits ----
    # These MUST mirror DWB limits in nav2_params.yaml exactly.
    min_linear_vel: -0.5 # m/s — match min_vel_x in DWB
    max_linear_vel: 0.5 # m/s — match max_vel_x in DWB
    min_angular_vel: -0.6 # rad/s — match min_vel_theta in DWB
    max_angular_vel: 0.6 # rad/s — match max_vel_theta in DWB

    # ---- Rate Limiter ----
    # MUST match acc/decel limits in nav2_params DWB config.
    # Motor-verified: linear = 0.152 m/s², angular = 1.52 rad/s²
    max_linear_accel: 0.15 # m/s²  — motor verified (was 0.3)
    max_linear_decel: 0.15 # m/s²  — motor verified (was 0.6); matches decel_lim_x
    max_angular_accel: 1.2 # rad/s² — motor verified (was 1.5)
    max_angular_decel: 1.2 # rad/s² — motor verified (was 1.5); matches decel_lim_theta

    # ---- PID Gains (per wheel, in rad/s) ----
    # FF handles ~90% of setpoint. PID closes residual error only.
    # Left motor runs ~5-8% faster than right (encoder tick asymmetry confirmed).
    kp_left: 0.20
    kp_right: 0.20
    ki_left: 0.15
    ki_right: 0.15
    kd_left: 0.07
    kd_right: 0.07

    # ---- Anti-Windup ----
    max_integral: 3.0 # rad/s, shared — raised to give integral enough authority for direction asymmetry

    # ---- Feedforward (per wheel) ----
    feedforward_gain_left: 1.17 # left port drives physical right wheel (slower) → higher FF
    feedforward_gain_right: 1.15 # right port drives physical left wheel (faster) → lower FF

    # ---- Timeout ----
    cmd_timeout: 0.5 # seconds
