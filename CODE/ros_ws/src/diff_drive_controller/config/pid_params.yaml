# ============================================================================
# Wheel Speed Controller Configuration
#
# Sits after twist_mux. Subscribes to /cmd_vel_out (body Twist from any source),
# uses encoder feedback to close per-wheel velocity loops, publishes
# corrected wheel speeds on /wheel_speeds (Float32MultiArray [omega_l, omega_r]).
# ============================================================================
# CHANGES FROM PREVIOUS VERSION:
#   - max_linear_vel: 0.4 → 0.5 (match new facility cap)
#   - min_angular_vel / max_angular_vel: ±0.4 → ±0.6 (robot can do 3 rad/s,
#     capped at 0.6 to prevent VO drift during rotation; must match DWB)
#   - max_linear_decel: 0.6 → 0.5 (match decel_lim_x in nav2_params)
#   - max_angular_accel: 1.5 → 0.8 (match acc_lim_theta in nav2_params)
#   - max_angular_decel: 1.5 → 1.0 (match decel_lim_theta in nav2_params)
# ============================================================================

pid_controller:
  ros__parameters:
    # ---- Physical (must match controller_params.yaml) ----
    wheel_radius: 0.05
    base_length: 0.4

    # ---- Control Loop ----
    control_rate: 10.0 # Hz (match controller_node control_dt)

    # ---- Velocity Limits (clamp incoming body Twist before kinematics) ----
    # These MUST match the DWB limits in nav2_params.yaml exactly.
    # If DWB commands a velocity this layer silently clamps, DWB's trajectory
    # simulation becomes wrong and the robot will overshoot or mis-track.
    min_linear_vel: -0.1 # m/s — match min_vel_x in DWB
    max_linear_vel: 0.5 # m/s — match max_vel_x in DWB
    min_angular_vel: -0.6 # rad/s — match min_vel_theta in DWB
    max_angular_vel: 0.6 # rad/s — match max_vel_theta in DWB

    # ---- Rate Limiter ----
    # Must match acc/decel limits in nav2_params DWB config.
    max_linear_accel: 0.3
    max_linear_decel: 0.5 # reduced from 0.6 to match decel_lim_x in DWB
    max_angular_accel: 0.8 # reduced from 1.5 to match acc_lim_theta in DWB
    max_angular_decel: 1.0 # reduced from 1.5 to match decel_lim_theta in DWB

    # ---- PID Gains (per wheel, in rad/s) ----
    # Left motor runs ~5-8% faster than right (confirmed by encoder tick asymmetry).
    # FF handles the bulk of the setpoint (~90%). PID closes the residual error only.
    # Symmetric Kp/Ki to start — adjust per-wheel only if asymmetry persists after FF fix.
    kp_left: 0.10
    kp_right: 0.10
    ki_left: 0.08
    ki_right: 0.08
    kd_left: 0.07
    kd_right: 0.07

    # ---- Anti-Windup ----
    max_integral: 2.0 # Clamp integral term (rad/s), shared

    # ---- Feedforward (per wheel) ----
    # FF should cover ~90% of desired wheel speed open-loop.
    # Left motor is naturally faster → slightly lower FF to avoid overshoot.
    # Right motor is naturally slower → slightly higher FF to push it to setpoint.
    feedforward_gain_left: 1.15
    feedforward_gain_right: 1.17

    # ---- Timeout ----
    cmd_timeout: 0.5 # Nav2 command timeout (seconds)
