tiles:
  1:
    name: "tile1"
    file: "tile1.yaml"
    description: "Starting area"
    # World bounds: X[0.00, 18.00] Y[18.05, 38.00]

  2:
    name: "tile2"
    file: "tile2.yaml"
    description: "Lower horizontal corridor (connects tile1 to tile3)"
    # World bounds: X[14.00, 28.55] Y[32.25, 36.75]

  3:
    name: "tile3"
    file: "tile3.yaml"
    description: "Vertical junction corridor"
    # World bounds: X[24.55, 35.15] Y[0.00, 41.55]

  4:
    name: "tile4"
    file: "tile4.yaml"
    description: "Upper horizontal corridor (connects tile3 to tile5)"
    # World bounds: X[31.15, 54.85] Y[0.00, 41.55]

  5:
    name: "tile5"
    file: "tile5.yaml"
    description: "End section"
    # World bounds: X[50.85, 59.40] Y[5.50, 39.80]

# ============================================================
# TRIGGER ZONES
# ============================================================
# bounds: [x_min, x_max, y_min, y_max]
# heading: direction robot must face to trigger
#
# IMPORTANT: Trigger zones are positioned at corridor intersections
# - Zones 1↔2 and 2↔3: Lower corridor level (Y ≈ 32.75-36.25)
# - Zones 3↔4 and 4↔5: Upper corridor level (Y ≈ 36.30-38.70)

trigger_zones:
  # ─────────────────────────────────────────────────────────
  # Tile 1 <-> Tile 2 (LOWER CORRIDOR)
  # Overlap: X[14.00, 18.00] Y[32.75, 35.65]
  # ─────────────────────────────────────────────────────────
  - bounds: [0.98, 4.60, 10.36, 13.96]
    from_tile: 1
    to_tile: 2
    heading: "+x"
    description: "tile1 → tile2"

  - bounds: [0.98, 4.60, 10.36, 13.96]
    from_tile: 2
    to_tile: 1
    heading: "-x"
    description: "tile2 → tile1"

  # ─────────────────────────────────────────────────────────
  # Tile 2 <-> Tile 3 (LOWER CORRIDOR)
  # Overlap: X[24.55, 28.55] Y[32.75, 36.25]
  # ─────────────────────────────────────────────────────────
  - bounds: [9.03, 12.62, 10.36, 13.96]
    from_tile: 2
    to_tile: 3
    heading: "+x"
    description: "tile2 → tile3"

  - bounds: [9.03, 12.62, 10.36, 13.96]
    from_tile: 3
    to_tile: 2
    heading: "-x"
    description: "tile3 → tile2"

  # ─────────────────────────────────────────────────────────
  # Tile 3 <-> Tile 4 (UPPER CORRIDOR)
  # Overlap: X[31.15, 35.15] Y[36.30, 38.70]
  # ─────────────────────────────────────────────────────────
  - bounds: [14.31, 17.51, 12.60, 16.44]
    from_tile: 3
    to_tile: 4
    heading: "+x"
    description: "tile3 → tile4"

  - bounds: [14.31, 17.51, 12.60, 16.44]
    from_tile: 4
    to_tile: 3
    heading: "-x"
    description: "tile4 → tile3"

  # ─────────────────────────────────────────────────────────
  # Tile 4 <-> Tile 5 (UPPER CORRIDOR)
  # Overlap: X[50.85, 54.85] Y[36.30, 38.70]
  # ─────────────────────────────────────────────────────────
  - bounds: [33.30, 33.35, 12.60, 16.42]
    from_tile: 4
    to_tile: 5
    heading: "+x"
    description: "tile4 → tile5"

  - bounds: [33.30, 33.35, 12.60, 16.42]
    from_tile: 5
    to_tile: 4
    heading: "-x"
    description: "tile5 → tile4"

# ============================================================
# SETTINGS
# ============================================================
settings:
  initial_tile: 1
  switch_cooldown: 0.5 # seconds between tile switches
